name: neptune_flutter_ui
version: 2.22.0
description: >-
  Neptune Odyssey Flutter UI — the vendor-neutral, white-label banking design
  system by Neptune.Fintech. Deterministic brandprints, Material 3 themes,
  and themed widgets for the four reference brands and any custom seed.
homepage: https://neptune.ly
repository: https://github.com/neptune-ly/neptune_odyssey

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

screenshots:
  - description: "Welcome / Sign-in template — ambient drifting orbs, brand lockup, mixed-weight promise, animated CTA with specular sheen"
    path: screenshots/welcome.png
  - description: "Dashboard hero on the brand gradient with the sonar motif, eyebrow stat cards, and the floating glass dock"
    path: screenshots/hero_dock.png
  - description: "Card art carrying the Triton coastal-arc motif, card controls and dashed add-card"
    path: screenshots/card_motif.png
  - description: "Proteus dark — Sora display face, steel-to-gold hero, glass dock over navy"
    path: screenshots/dark_proteus.png
  - description: "One prop change re-skins everything — Nereid grid-spark motif and violet gradient"
    path: screenshots/brand_switch.png
  - description: "Full RTL with the brand Arabic faces — layout, gradient and dock mirror automatically"
    path: screenshots/rtl_arabic.png
  - description: "2.13.0: the loader family (hourglass/spinner/dots/pulse) feeding NeptuneStatusMotion's success/reject morph, NeptuneSplashScreen, and NeptuneAppBar's small/medium variants"
    path: screenshots/r6_additions.png

flutter:
  uses-material-design: true
